name: Deploy Field Notes

on:
  push:
    tags:
      - "release.*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          CONTACT_FORM_ENDPOINT: ${{ vars.CONTACT_FORM_ENDPOINT }}
        run: |
          if [ -z "$CONTACT_FORM_ENDPOINT" ]; then
            echo "CONTACT_FORM_ENDPOINT is not set in the repository variables."
            exit 1
          fi
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          curl -fsS "$base" | grep -q "Field Notes"
          curl -fsS -o /dev/null "$base"calibration/
          curl -fsS -o /dev/null "$base"mantis/
          curl -fsS -o /dev/null "$base"prism/